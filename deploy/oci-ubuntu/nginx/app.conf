# JuggleFit: server-context directives shared by the HTTP and HTTPS blocks.
# Installed to /etc/nginx/snippets/jugglefit-app.conf by install-host-config.sh.
# Managed from the repo: edit here, not on the host.

# Security headers
add_header X-Content-Type-Options nosniff;
add_header X-Frame-Options DENY;
add_header X-XSS-Protection "1; mode=block";
add_header Referrer-Policy "strict-origin-when-cross-origin";

# Apply rate limiting (defaults for every location below)
limit_conn conn_limit_per_ip 300;
limit_req zone=req_limit_per_ip burst=300 nodelay;

# Proxy to application (gunicorn, bound to 127.0.0.1:5001)
location / {
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
}

# Live final state (public, identical for every viewer -> cacheable)
location ~ ^/api/finals/[^/]+/state$ {
    limit_req zone=final_state_per_ip burst=300 nodelay;

    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache final_state;
    proxy_cache_valid 200 204 1s;
    proxy_cache_lock on;
    proxy_cache_use_stale updating;
    # Never cache or forward a session cookie on this shared response.
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    add_header X-Cache-Status $upstream_cache_status;
}

# Organizer password: create or resume a live final
location = /api/finals {
    limit_req zone=organizer_login_per_ip burst=5 nodelay;

    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Health check endpoint (no rate limiting)
location /health {
    proxy_pass http://127.0.0.1:5001/health;
    proxy_set_header Host $host;
    access_log off;
}

# Static files: served by nginx straight from the checkout on the host,
# so the ~30 files each phone loads never reach gunicorn.
location /static/ {
    alias /opt/jugglefit/static/;
    limit_req zone=static_per_ip burst=3000 nodelay;
    add_header Cache-Control $jugglefit_static_cache_control;
    # add_header here replaces the server-level headers; keep this one.
    add_header X-Content-Type-Options nosniff;
    access_log off;
}

# Gzip compression
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

access_log /var/log/nginx/jugglefit_access.log;
error_log /var/log/nginx/jugglefit_error.log;
