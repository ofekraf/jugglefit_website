# JuggleFit site, HTTPS (used once /etc/letsencrypt/live/__CERT_NAME__ exists).
# Rendered to /etc/nginx/sites-available/jugglefit by install-host-config.sh.
# certbot only issues/renews the certificate; it does not edit this file.
server {
    listen 80;
    server_name __SERVER_NAME__;

    # ACME http-01 challenges: certbot's nginx authenticator injects its own
    # location during renewal; this also covers a webroot authenticator.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name __SERVER_NAME__;

    ssl_certificate     /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:jugglefit_ssl:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS. Note: add_header in a location (e.g. /static/) replaces this,
    # which is fine: browsers only need it on one HTTPS response.
    add_header Strict-Transport-Security "max-age=63072000" always;

    include snippets/jugglefit-app.conf;
}
