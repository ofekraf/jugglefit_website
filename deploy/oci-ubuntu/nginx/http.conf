# JuggleFit: http-context directives.
# Installed to /etc/nginx/conf.d/jugglefit.conf by install-host-config.sh
# (Ubuntu's nginx.conf includes conf.d/*.conf inside http {}).
# Managed from the repo: edit here, not on the host.
#
# Per-IP limits are sized for ~150 phones behind ONE venue Wi-Fi IP (NAT).
# One phone's first visit = ~3 app requests (shortener redirect, route page,
# live page) + ~30 static files; a live final adds 1 state poll / ~3.5 s.
# 150 phones: ~450 app requests in a burst, ~4,500 static files, ~45 polls/s.
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
# Pages + API (gunicorn). Burst absorbs 150 phones arriving together.
limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=30r/s;
# Static files are served by nginx from disk (cheap); limit only abuse.
limit_req_zone $binary_remote_addr zone=static_per_ip:10m rate=300r/s;
# Live final state: cached 1 s below, so this only caps a single client.
limit_req_zone $binary_remote_addr zone=final_state_per_ip:10m rate=100r/s;
# Organizer password (POST /api/finals): slow down guessing.
limit_req_zone $binary_remote_addr zone=organizer_login_per_ip:10m rate=1r/s;
# 429 tells clients "slow down" (default 503 looks like an outage).
limit_req_status 429;
limit_conn_status 429;

# 1s microcache for live final state: gunicorn sees ~1 request/s per final,
# whatever the audience size.
proxy_cache_path /var/cache/nginx/jugglefit_final_state levels=1:2
                 keys_zone=final_state:1m max_size=10m inactive=1m use_temp_path=off;

# CSS/JS are linked with ?v=<cache_version> (changes every deploy), so those
# URLs never change content -> cache for a year, no revalidation requests.
# Unversioned files (images, favicon) keep a 1-day revalidating cache.
map $arg_v $jugglefit_static_cache_control {
    ""      "public, max-age=86400, must-revalidate";
    default "public, max-age=31536000, immutable";
}
