# JuggleFit site, HTTP only (used until a TLS certificate exists).
# Rendered to /etc/nginx/sites-available/jugglefit by install-host-config.sh.
# __SERVER_NAME__ is replaced with DOMAINS from .env (or "_").
server {
    listen 80;
    server_name __SERVER_NAME__;

    include snippets/jugglefit-app.conf;
}
