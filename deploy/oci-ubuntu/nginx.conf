# Rate-limit zones must be declared at http-context level. This file is
# included from /etc/nginx/sites-enabled/, which is inside the main
# nginx.conf http {} block, so top-level directives here are http-context.
#
# Per-IP limits are sized for ~150 phones behind ONE venue Wi-Fi IP (NAT).
# One phone's first visit = ~3 app requests (shortener redirect, route page,
# live page) + ~30 static files; a live final adds 1 state poll / ~3.5 s.
# 150 phones: ~450 app requests in a burst, ~4,500 static files, ~45 polls/s.
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
# Pages + API (gunicorn). Burst absorbs 150 phones arriving together.
limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=30r/s;
# Static files are served by nginx from disk (cheap); limit only abuse.
limit_req_zone $binary_remote_addr zone=static_per_ip:10m rate=300r/s;
# Live final state: cached 1 s below, so this only caps a single client.
limit_req_zone $binary_remote_addr zone=final_state_per_ip:10m rate=100r/s;
# Organizer password (POST /api/finals): slow down guessing.
limit_req_zone $binary_remote_addr zone=organizer_login_per_ip:10m rate=1r/s;
# 429 tells clients "slow down" (default 503 looks like an outage).
limit_req_status 429;
limit_conn_status 429;

# 1s microcache for live final state: gunicorn sees ~1 request/s per final,
# whatever the audience size.
proxy_cache_path /var/cache/nginx/jugglefit_final_state levels=1:2
                 keys_zone=final_state:1m max_size=10m inactive=1m use_temp_path=off;

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Apply rate limiting (defaults for every location below)
    limit_conn conn_limit_per_ip 300;
    limit_req zone=req_limit_per_ip burst=300 nodelay;

    # Proxy to application
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Live final state (public, identical for every viewer -> cacheable)
    location ~ ^/api/finals/[^/]+/state$ {
        limit_req zone=final_state_per_ip burst=300 nodelay;

        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache final_state;
        proxy_cache_valid 200 204 1s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating;
        # Never cache or forward a session cookie on this shared response.
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Organizer password: create or resume a live final
    location = /api/finals {
        limit_req zone=organizer_login_per_ip burst=5 nodelay;

        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint (no rate limiting)
    location /health {
        proxy_pass http://127.0.0.1:5001/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Static files: served by nginx straight from the checkout on the host
    # (update.sh builds the image from this same checkout), so the ~30 files
    # each phone loads never reach gunicorn.
    location /static/ {
        alias /opt/jugglefit/static/;
        limit_req zone=static_per_ip burst=3000 nodelay;
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        # add_header here replaces the server-level headers; keep this one.
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Access logs
    access_log /var/log/nginx/jugglefit_access.log;
    error_log /var/log/nginx/jugglefit_error.log;
}

# HTTPS: the 443 server block is added automatically by
# `certbot --nginx` (see setup-ssl.sh). Do NOT pre-declare it here —
# doing so makes `nginx -t` fail before certificates exist.
